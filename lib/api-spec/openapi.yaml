openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: preorder
    description: Guest pre-order flow (menu publish, orders)
  - name: feedback
    description: Guest feedback / multi-criteria ratings
  - name: rollup
    description: Server-side multi-location aggregations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /preorder/menu/{locationCode}:
    get:
      operationId: getPublishedMenu
      tags: [preorder]
      summary: Public menu lookup by short location code (used by guest QR app).
      parameters:
        - in: path
          name: locationCode
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current published menu for the location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedMenu"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /preorder/menu/publish:
    post:
      operationId: publishMenu
      tags: [preorder]
      summary: Staff pushes the current menu for a location (requires auth).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishMenuBody"
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedMenu"

  /preorder/orders:
    post:
      operationId: createGuestOrder
      tags: [preorder]
      summary: Authenticated business customer creates a pre-order (requires Clerk auth + business_approved account; cutoff 08:00 Europe/Berlin of wantedFor date).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestOrder"
        "400":
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /preorder/orders/{id}:
    get:
      operationId: getGuestOrder
      tags: [preorder]
      summary: Public order status lookup using id + access token.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestOrder"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /preorder/orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [preorder]
      summary: Staff transitions an order's status (requires auth).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestOrder"

  /preorder/feedback:
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Guest submits multi-criteria feedback for a location (no auth).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackBody"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestFeedback"
        "400":
          description: Invalid feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /preorder/staff/feedback:
    get:
      operationId: listStaffFeedback
      tags: [feedback]
      summary: Staff lists recent feedback for a location with aggregate (requires auth).
      parameters:
        - in: query
          name: locationCode
          required: true
          schema:
            type: string
        - in: query
          name: days
          required: false
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Feedback list with aggregate ratings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackSummary"

  /rollup/locations:
    get:
      operationId: getLocationRollup
      tags: [rollup]
      summary: Aggregate orders + feedback across all of the caller's locations (requires auth).
      parameters:
        - in: query
          name: days
          required: false
          schema:
            type: integer
            default: 7
      responses:
        "200":
          description: Per-location rollup
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocationRollup"

  /preorder/staff/orders:
    get:
      operationId: listStaffOrders
      tags: [preorder]
      summary: Staff lists pending/active orders for a location (requires auth).
      parameters:
        - in: query
          name: locationCode
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuestOrder"

  /preorder/staff/orders/aggregate:
    get:
      operationId: getStaffOrdersAggregate
      tags: [preorder]
      summary: Staff aggregate of orders by customer for a given day.
      parameters:
        - in: query
          name: locationCode
          required: true
          schema:
            type: string
        - in: query
          name: date
          required: false
          description: ISO date YYYY-MM-DD (Europe/Berlin); defaults to today.
          schema:
            type: string
      responses:
        "200":
          description: Aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderAggregateResponse"

  /preorder/customer/me:
    get:
      operationId: getCustomerProfile
      tags: [preorder]
      summary: Get the authenticated customer's profile (creates a default 'regular' profile if missing).
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
    patch:
      operationId: upsertCustomerProfile
      tags: [preorder]
      summary: Update profile and optionally request business approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCustomerProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"

  /preorder/customer/orders:
    get:
      operationId: listCustomerOrders
      tags: [preorder]
      summary: List the authenticated customer's recent orders.
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuestOrder"

  /preorder/orders/{id}/items:
    patch:
      operationId: updateOrderItems
      tags: [preorder]
      summary: Customer edits the items / note of their own order before the daily 08:00 cutoff.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderItemsBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestOrder"
        "409":
          description: Past cutoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /preorder/orders/{id}/cancel:
    post:
      operationId: cancelOwnOrder
      tags: [preorder]
      summary: Customer cancels their own order before the daily 08:00 cutoff.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestOrder"
        "409":
          description: Past cutoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /preorder/staff/customers:
    get:
      operationId: listStaffCustomers
      tags: [preorder]
      summary: Staff lists customer profiles bound to caller's locations, optionally filtered by status.
      parameters:
        - in: query
          name: status
          required: false
          schema:
            $ref: "#/components/schemas/CustomerAccountType"
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerProfile"

  /preorder/staff/customers/{clerkUserId}:
    patch:
      operationId: decideStaffCustomer
      tags: [preorder]
      summary: Staff approves or rejects a pending business customer request.
      parameters:
        - in: path
          name: clerkUserId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideCustomerBody"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"

  /preorder/staff/ref-codes:
    get:
      operationId: listRefCodes
      tags: [preorder]
      summary: Admin lists all generated business reference codes for their org.
      responses:
        "200":
          description: List of reference codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessRefCode"
    post:
      operationId: createRefCode
      tags: [preorder]
      summary: Admin generates a new business reference code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefCodeBody"
      responses:
        "201":
          description: Created reference code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessRefCode"

  /preorder/staff/ref-codes/{code}:
    delete:
      operationId: deleteRefCode
      tags: [preorder]
      summary: Admin revokes (deletes) a reference code.
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /preorder/customer/redeem-code:
    post:
      operationId: redeemRefCode
      tags: [preorder]
      summary: Customer redeems a reference code to become business_approved instantly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRefCodeBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"

  /preorder/staff/announcements:
    get:
      operationId: listStaffAnnouncements
      tags: [preorder]
      summary: Admin lists announcements for their org.
      parameters:
        - in: query
          name: locationCode
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalAnnouncement"
    post:
      operationId: createAnnouncement
      tags: [preorder]
      summary: Admin creates a new announcement (optionally with a PDF or image attachment as base64).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnouncementBody"
      responses:
        "201":
          description: Created announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalAnnouncement"

  /preorder/staff/announcements/{id}:
    delete:
      operationId: deleteAnnouncement
      tags: [preorder]
      summary: Admin deletes an announcement.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  # ── Weekly menus ────────────────────────────────────────────────────────────

  /preorder/staff/weekly-menus:
    get:
      operationId: listWeeklyMenus
      tags: [preorder]
      summary: Staff — list weekly KW menus for the org (auth required).
      parameters:
        - in: query
          name: locationCode
          schema:
            type: string
        - in: query
          name: kwYear
          schema:
            type: integer
        - in: query
          name: kwNumber
          schema:
            type: integer
      responses:
        "200":
          description: List of weekly menus
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyMenu"
    post:
      operationId: createWeeklyMenu
      tags: [preorder]
      summary: Staff — create a new weekly KW menu (auth required).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWeeklyMenuBody"
      responses:
        "201":
          description: Created weekly menu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyMenu"

  /preorder/staff/weekly-menus/{id}:
    put:
      operationId: updateWeeklyMenu
      tags: [preorder]
      summary: Staff — update a weekly menu (auth required).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWeeklyMenuBody"
      responses:
        "200":
          description: Updated weekly menu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyMenu"
    delete:
      operationId: deleteWeeklyMenu
      tags: [preorder]
      summary: Staff — delete a weekly menu (auth required).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /preorder/weekly-menus/{locationCode}:
    get:
      operationId: listPublicWeeklyMenus
      tags: [preorder]
      summary: Public — list upcoming weekly menus for a location.
      parameters:
        - in: path
          name: locationCode
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Upcoming weekly menus
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyMenu"

  # ── Client price lists ───────────────────────────────────────────────────────

  /preorder/staff/price-lists:
    get:
      operationId: listPriceLists
      tags: [preorder]
      summary: Staff — list price list entries for a customer (auth required).
      parameters:
        - in: query
          name: clerkUserId
          schema:
            type: string
        - in: query
          name: locationCode
          schema:
            type: string
      responses:
        "200":
          description: Price list entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientPriceEntry"
    post:
      operationId: upsertPriceEntry
      tags: [preorder]
      summary: Staff — create or update a price entry for a customer + dishType (auth required).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPriceEntryBody"
      responses:
        "200":
          description: Saved price entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPriceEntry"

  /preorder/staff/price-lists/{id}:
    delete:
      operationId: deletePriceEntry
      tags: [preorder]
      summary: Staff — delete a price list entry (auth required).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  # ── Location settings ────────────────────────────────────────────────────────

  /preorder/staff/location-settings/{locationCode}:
    get:
      operationId: getLocationSettings
      tags: [preorder]
      summary: Staff — get ordering settings for a location (auth required).
      parameters:
        - in: path
          name: locationCode
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Location settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSettings"
    patch:
      operationId: patchLocationSettings
      tags: [preorder]
      summary: Staff — update ordering settings for a location (auth required).
      parameters:
        - in: path
          name: locationCode
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchLocationSettingsBody"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSettings"

  # ── Delivery ledger & reports ────────────────────────────────────────────────

  /preorder/staff/delivery-ledger:
    get:
      operationId: listDeliveryLedger
      tags: [preorder]
      summary: Staff — list delivery ledger entries (auth required).
      parameters:
        - in: query
          name: locationCode
          schema:
            type: string
        - in: query
          name: clerkUserId
          schema:
            type: string
        - in: query
          name: dateFrom
          schema:
            type: string
            description: ISO date YYYY-MM-DD
        - in: query
          name: dateTo
          schema:
            type: string
            description: ISO date YYYY-MM-DD
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryLedgerEntry"

  /preorder/staff/delivery-ledger/finalize-day:
    post:
      operationId: finalizeDeliveryDay
      tags: [preorder]
      summary: Staff — finalize all served orders for a date and write to ledger (auth required).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeDayBody"
      responses:
        "200":
          description: Number of ledger entries written
          content:
            application/json:
              schema:
                type: object
                properties:
                  written:
                    type: integer
                required: [written]

  /preorder/staff/report:
    get:
      operationId: getDeliveryReport
      tags: [preorder]
      summary: Staff — aggregated delivery report for a period (auth required).
      parameters:
        - in: query
          name: locationCode
          required: true
          schema:
            type: string
        - in: query
          name: dateFrom
          required: true
          schema:
            type: string
        - in: query
          name: dateTo
          required: true
          schema:
            type: string
        - in: query
          name: clerkUserId
          schema:
            type: string
      responses:
        "200":
          description: Report grouped by customer and dish type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryReport"

  /preorder/announcements/{locationCode}:
    get:
      operationId: listAnnouncements
      tags: [preorder]
      summary: Public — list announcements for a location (without file data).
      parameters:
        - in: path
          name: locationCode
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of announcements (no file data)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalAnnouncementPublic"

  /preorder/announcements/{locationCode}/{id}/file:
    get:
      operationId: getAnnouncementFile
      tags: [preorder]
      summary: Public — download the file attachment of an announcement.
      parameters:
        - in: path
          name: locationCode
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File binary (PDF, image, etc.)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    PreorderDish:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        type:
          type: ["string", "null"]
        allergens:
          type: array
          items:
            type: string
        imageUrl:
          type: ["string", "null"]
        kcal:
          type: ["number", "null"]
        proteinG:
          type: ["number", "null"]
        carbsG:
          type: ["number", "null"]
        fatG:
          type: ["number", "null"]
        dge:
          type: ["string", "null"]
          enum: [green, amber, red, null]
        co2eG:
          type: ["number", "null"]
      required: [id, name, price, allergens]

    FeedbackRatings:
      type: object
      properties:
        foodQuality:
          type: integer
          minimum: 1
          maximum: 5
        service:
          type: integer
          minimum: 1
          maximum: 5
        variety:
          type: integer
          minimum: 1
          maximum: 5
        value:
          type: integer
          minimum: 1
          maximum: 5
        cleanliness:
          type: integer
          minimum: 1
          maximum: 5
        ambience:
          type: integer
          minimum: 1
          maximum: 5
      required: [foodQuality, service, variety, value, cleanliness, ambience]

    GuestFeedback:
      type: object
      properties:
        id:
          type: string
        locationCode:
          type: string
        ratings:
          $ref: "#/components/schemas/FeedbackRatings"
        overall:
          type: number
        comment:
          type: ["string", "null"]
        guestName:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, locationCode, ratings, overall, createdAt]

    CreateFeedbackBody:
      type: object
      properties:
        locationCode:
          type: string
          minLength: 1
          maxLength: 32
        ratings:
          $ref: "#/components/schemas/FeedbackRatings"
        comment:
          type: ["string", "null"]
          maxLength: 500
        guestName:
          type: ["string", "null"]
          maxLength: 60
      required: [locationCode, ratings]

    FeedbackAggregate:
      type: object
      properties:
        count:
          type: integer
        avgFoodQuality:
          type: number
        avgService:
          type: number
        avgVariety:
          type: number
        avgValue:
          type: number
        avgCleanliness:
          type: number
        avgAmbience:
          type: number
        avgOverall:
          type: number
      required:
        [
          count,
          avgFoodQuality,
          avgService,
          avgVariety,
          avgValue,
          avgCleanliness,
          avgAmbience,
          avgOverall,
        ]

    FeedbackSummary:
      type: object
      properties:
        aggregate:
          $ref: "#/components/schemas/FeedbackAggregate"
        recent:
          type: array
          items:
            $ref: "#/components/schemas/GuestFeedback"
      required: [aggregate, recent]

    LocationRollup:
      type: object
      properties:
        locationCode:
          type: string
        locationName:
          type: string
        currency:
          type: string
        ordersCount:
          type: integer
        revenue:
          type: number
        avgTicket:
          type: number
        statusBreakdown:
          type: object
          additionalProperties:
            type: integer
        feedback:
          $ref: "#/components/schemas/FeedbackAggregate"
        publishedAt:
          type: ["string", "null"]
      required:
