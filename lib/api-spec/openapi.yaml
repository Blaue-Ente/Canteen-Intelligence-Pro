          type: integer
          description: Hour (0-23) after which orders for the same day are locked
        autoFinalize:
          type: boolean
        updatedAt:
          type: string
      required: [locationCode, orgId, leadDays, cutoffHour, autoFinalize, updatedAt]

    PatchLocationSettingsBody:
      type: object
      properties:
        leadDays:
          type: integer
        cutoffHour:
          type: integer
        autoFinalize:
          type: boolean

    # ── Delivery ledger ────────────────────────────────────────────────────────

    LedgerItem:
      type: object
      properties:
        dishId:
          type: string
        name:
          type: string
        dishType:
          type: string
        qty:
          type: integer
        unitPrice:
          type: number
        lineTotal:
          type: number
      required: [dishId, name, dishType, qty, unitPrice, lineTotal]

    DeliveryLedgerEntry:
