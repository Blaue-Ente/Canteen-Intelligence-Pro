        locationName:
          type: string
        currency:
          type: string
        dishes:
          type: array
          items:
            $ref: "#/components/schemas/PreorderDish"
        publishedAt:
          type: string
      required: [locationCode, locationName, currency, dishes, publishedAt]

    PublishMenuBody:
      type: object
      properties:
        locationCode:
          type: string
        locationName:
          type: string
        currency:
          type: string
        dishes:
          type: array
          items:
            $ref: "#/components/schemas/PreorderDish"
      required: [locationCode, locationName, dishes]

    OrderItem:
      type: object
      properties:
        dishId:
          type: string
        name:
          type: string
        qty:
          type: integer
        price:
          type: number
      required: [dishId, name, qty, price]

    GuestOrderStatus:
      type: string
      enum: [new, accepted, preparing, ready, served, cancelled]

    GuestOrder:
      type: object
      properties:
        id:
          type: string
        locationCode:
          type: string
        guestName:
          type: string
        guestNote:
          type: ["string", "null"]
        customerId:
          type: ["string", "null"]
        wantedFor:
          type: ["string", "null"]
          description: ISO date YYYY-MM-DD when the order is wanted for.
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total:
          type: number
        currency:
          type: string
        status:
          $ref: "#/components/schemas/GuestOrderStatus"
        accessToken:
          type: ["string", "null"]
        editable:
          type: boolean
          description: True if the order can still be edited or cancelled (before 08:00 Europe/Berlin of wantedFor).
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, locationCode, guestName, items, total, currency, status, editable, createdAt, updatedAt]

    CreateOrderBody:
      type: object
      properties:
        locationCode:
          type: string
        guestName:
          type: string
        guestNote:
          type: ["string", "null"]
        wantedFor:
          type: ["string", "null"]
          description: ISO date YYYY-MM-DD; defaults to today.
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
      required: [locationCode, guestName, items]

    UpdateOrderStatusBody:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/GuestOrderStatus"
      required: [status]

    UpdateOrderItemsBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        guestNote:
          type: ["string", "null"]
      required: [items]

    CustomerAccountType:
      type: string
      enum: [regular, business_pending, business_approved, rejected]

    CustomerProfile:
      type: object
      properties:
        clerkUserId:
          type: string
        displayName:
          type: string
        email:
          type: ["string", "null"]
        homeLocationCode:
          type: ["string", "null"]
        accountType:
          $ref: "#/components/schemas/CustomerAccountType"
        ownerOrgId:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [clerkUserId, displayName, accountType, createdAt, updatedAt]

    UpsertCustomerProfileBody:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: ["string", "null"]
        homeLocationCode:
          type: ["string", "null"]
        requestBusiness:
          type: boolean
          description: If true, sets accountType to business_pending (only valid from regular).
      required: [displayName]

    DecideCustomerBody:
      type: object
      properties:
        decision:
          type: string
          enum: [approve, reject]
      required: [decision]

    OrderAggregateLine:
      type: object
      properties:
        customerName:
          type: string
        customerId:
          type: ["string", "null"]
        items:
          type: array
          items:
            type: object
            properties:
              dishId:
                type: string
              name:
                type: string
              qty:
                type: integer
            required: [dishId, name, qty]
        total:
          type: number
        orderIds:
          type: array
          items:
            type: string
      required: [customerName, items, total, orderIds]

    OrderAggregateResponse:
      type: object
      properties:
        date:
          type: string
        locationCode:
          type: string
        currency:
          type: string
        totalsByDish:
          type: array
          items:
            type: object
            properties:
              dishId:
                type: string
              name:
                type: string
              qty:
                type: integer
            required: [dishId, name, qty]
        byCustomer:
          type: array
          items:
            $ref: "#/components/schemas/OrderAggregateLine"
        grandTotal:
          type: number
      required: [date, locationCode, currency, totalsByDish, byCustomer, grandTotal]

    BusinessRefCode:
      type: object
      properties:
        code:
          type: string
        orgId:
          type: string
        locationCode:
          type: string
        label:
          type: ["string", "null"]
        createdBy:
          type: string
        maxUses:
          type: integer
        usesCount:
          type: integer
        createdAt:
          type: string
      required: [code, orgId, locationCode, createdBy, maxUses, usesCount, createdAt]

    CreateRefCodeBody:
      type: object
      properties:
        locationCode:
          type: string
        label:
          type: ["string", "null"]
          description: Optional label for admin reference, e.g. company name.
        maxUses:
          type: integer
          description: How many times the code can be redeemed (default 1).
      required: [locationCode]

    RedeemRefCodeBody:
      type: object
      properties:
        code:
          type: string
      required: [code]

    PortalAnnouncement:
      type: object
      properties:
        id:
          type: string
        orgId:
          type: string
        locationCode:
          type: string
        title:
          type: string
        body:
          type: ["string", "null"]
        fileName:
          type: ["string", "null"]
        mimeType:
          type: ["string", "null"]
        fileData:
          type: ["string", "null"]
          description: Base64-encoded file content.
        createdBy:
          type: string
        publishedAt:
          type: string
      required: [id, orgId, locationCode, title, createdBy, publishedAt]

    PortalAnnouncementPublic:
      type: object
      properties:
        id:
          type: string
        locationCode:
          type: string
        title:
          type: string
        body:
          type: ["string", "null"]
        fileName:
          type: ["string", "null"]
        mimeType:
          type: ["string", "null"]
        hasFile:
          type: boolean
        publishedAt:
          type: string
      required: [id, locationCode, title, hasFile, publishedAt]

    CreateAnnouncementBody:
      type: object
      properties:
        locationCode:
          type: string
        title:
          type: string
        body:
          type: ["string", "null"]
        fileName:
          type: ["string", "null"]
        mimeType:
          type: ["string", "null"]
        fileData:
          type: ["string", "null"]
          description: Base64-encoded file content (max ~7 MB base64 = ~5 MB raw).
      required: [locationCode, title]

    # ── Weekly menus ───────────────────────────────────────────────────────────

    WeeklyMenuDish:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        dishType:
          type: string
          description: e.g. "Hauptgericht 1", "Suppe", "Dessert"
        menuDate:
          type: string
          description: ISO date YYYY-MM-DD — which day this dish is served
        price:
          type: number
        allergens:
          type: array
          items:
            type: string
        kcal:
          type: ["number", "null"]
        dge:
          type: ["string", "null"]
          enum: [green, amber, red, null]
      required: [id, name, dishType, menuDate, price, allergens]

    WeeklyMenu:
      type: object
      properties:
        id:
          type: string
        orgId:
          type: string
        locationCode:
          type: string
        menuSlot:
          type: string
          description: e.g. "Menü 1", "Menü 2"
        kwYear:
          type: integer
        kwNumber:
          type: integer
        validFrom:
          type: string
          description: ISO date YYYY-MM-DD (Monday of the week)
        validTo:
          type: string
          description: ISO date YYYY-MM-DD (Friday or Sunday of the week)
        currency:
          type: string
        dishes:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyMenuDish"
        createdBy:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, orgId, locationCode, menuSlot, kwYear, kwNumber, validFrom, validTo, currency, dishes, createdBy, createdAt, updatedAt]

    CreateWeeklyMenuBody:
      type: object
      properties:
        locationCode:
          type: string
        menuSlot:
          type: string
        kwYear:
          type: integer
        kwNumber:
          type: integer
        validFrom:
          type: string
        validTo:
          type: string
        currency:
          type: string
        dishes:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyMenuDish"
      required: [locationCode, kwYear, kwNumber, validFrom, validTo, dishes]

    # ── Client price lists ─────────────────────────────────────────────────────

    ClientPriceEntry:
      type: object
      properties:
