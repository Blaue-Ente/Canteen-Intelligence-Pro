kind = "mobile"
previewPath = "/"
title = "KitchenOS"
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production.build]
args = ["sh", "artifacts/mobile/scripts/build-web.sh"]

[services.production.run]
args = ["node", "artifacts/mobile/server/serve-web.js"]

[services.production.run.env]
PORT = "18115"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "18115"
BASE_PATH = "/"
